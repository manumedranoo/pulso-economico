# Robot de noticias: cada hora recoge titulares y actualiza noticias.json.
name: Actualizar noticias

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, en el minuto 17
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recoger titulares
        run: python scripts/actualizar.py
      - name: Guardar cambios
        run: |
          git config user.name "Robot de noticias"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Noticias actualizadas"
            git push
          fi
